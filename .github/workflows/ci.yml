name: CI — Build & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  composeapp-build:
    name: ComposeApp — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      # La app es un único módulo KMP (:composeApp); el antiguo :server fue
      # eliminado al pasar a Firestore REST directo. Compilamos el target JVM
      # (commonMain + jvmMain) sin necesitar el SDK de Android.
      - name: Build composeApp (JVM)
        run: ./gradlew :composeApp:jvmJar

      # El target JVM NO compila androidMain (MainActivity, Workers, Analytics,
      # AdMob...): antes CI podía estar en verde con androidMain roto. Los
      # runners ubuntu-latest de GitHub traen el Android SDK preinstalado, así
      # que no hace falta configurarlo aparte.
      - name: Build composeApp (Android)
        run: ./gradlew :composeApp:compileDebugKotlinAndroid

      # Tests puros de commonTest (FirestoreParsers, PointsRules, RecurrenceRules):
      # antes nunca se ejecutaban en CI pese a existir.
      - name: Run tests (JVM)
        run: ./gradlew :composeApp:jvmTest

      - name: Lint — detekt
        run: ./gradlew :composeApp:detekt
        continue-on-error: true

  functions-tests:
    name: Cloud Functions — Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      # El emulador de Firestore (`npm run test:integration`) es un jar de
      # Java — los runners ubuntu-latest ya traen JDK, pero se fija una
      # versión explícita para no depender de lo que venga preinstalado.
      - name: Setup JDK 21 (emulador Firestore)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Type-check
        working-directory: functions
        run: npx tsc --noEmit

      # Tests puros (penalty.ts, rules.ts) — sin emulador, rápidos.
      - name: Run unit tests
        working-directory: functions
        run: npm test

      # Tests de integración contra el emulador de Firestore (completar/
      # deshacer/reasignar tarea, purga TTL) — ver `docs/` de infraestructura
      # de Cloud Functions.
      - name: Run integration tests (Firestore emulator)
        working-directory: functions
        run: npm run test:integration
