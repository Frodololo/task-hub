<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Hub</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            /* Mismo Teal800 que SplashScreen.kt (primera pantalla real tras
               cargar el bundle Wasm) para evitar el parpadeo a blanco por
               defecto del navegador mientras Compose se monta. */
            background-color: #007660;
        }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <script>
        // Puente Google Identity Services (GIS) <-> Kotlin/Wasm (ver
        // `Platform.wasmJs.kt`, `launchGoogleSignIn`). Kotlin/Wasm no puede
        // pasar un lambda propio como callback de una función JS externa de
        // forma fiable, así que el puente vive enteramente en JS: guarda el
        // resultado en `window.__taskhubGis` y Kotlin lo sondea por polling
        // (ver `jsGoogleSignInDone`/`jsGoogleSignInValue`).
        // `reason` (consumido por `consumeLastSignInFailureReason` en
        // Platform.wasmJs.kt) distingue, cuando `value` queda vacío, entre
        // una cancelación normal del usuario ("") y un fallo real que merece
        // un mensaje específico: "gis_not_loaded" (la librería GIS no cargó)
        // u "origin_not_authorized" (el origin/client_id no está autorizado
        // en la consola de Google) — ver GoogleAuthManager.kt.
        window.__taskhubGis = { state: "idle", value: "", reason: "" };

        function __taskhubGisCredentialCallback(response) {
            window.__taskhubGis.value = (response && response.credential) ? response.credential : "";
            window.__taskhubGis.reason = "";
            window.__taskhubGis.state = "done";
        }

        // Motivos de `getNotDisplayedReason()`/`getSkippedReason()` que
        // indican una configuración rota (origin/client_id no autorizado en
        // la consola de Google) en vez de una decisión del usuario — ver
        // https://developers.google.com/identity/gsi/web/reference/js-reference#PromptMomentNotification.
        var __taskhubGisConfigReasons = ["unregistered_origin", "invalid_client", "missing_client_id"];

        // El callback de `initialize` SOLO se invoca si el usuario completa el
        // login; sin este segundo callback de `prompt`, cerrar el selector de
        // cuentas (o que GIS lo oculte por cookies de terceros bloqueadas,
        // etc.) dejaba `state` en "pending" para siempre y `GoogleAuthManager`
        // colgado en `SigningIn` (mismo contrato de cancelación que Android).
        function __taskhubGisNotificationCallback(notification) {
            try {
                if (window.__taskhubGis.state === "pending" &&
                    (notification.isNotDisplayed() || notification.isSkippedMoment() || notification.isDismissedMoment())) {
                    var reason = "";
                    try {
                        var rawReason = notification.isNotDisplayed()
                            ? notification.getNotDisplayedReason()
                            : (notification.isSkippedMoment() ? notification.getSkippedReason() : null);
                        if (rawReason && __taskhubGisConfigReasons.indexOf(rawReason) !== -1) {
                            reason = "origin_not_authorized";
                        }
                    } catch (inner) {
                        // Sin el detalle del motivo, se trata como cancelación normal.
                    }
                    window.__taskhubGis.value = "";
                    window.__taskhubGis.reason = reason;
                    window.__taskhubGis.state = "done";
                }
            } catch (e) {
                // Si la API de notificación cambia de forma, no bloquear aquí:
                // el timeout del lado Kotlin (ver Platform.wasmJs.kt) resuelve
                // igualmente el estado "pending" colgado.
            }
        }

        function __taskhubStartGoogleSignIn(clientId) {
            window.__taskhubGis.state = "pending";
            window.__taskhubGis.value = "";
            window.__taskhubGis.reason = "";
            var attempts = 0;
            // Tope de reintentos esperando a que cargue `accounts.google.com/gsi/client`
            // (script `async defer`): 5s (50 * 100ms). Si nunca llega (red
            // bloqueada, CSP, adblocker), antes este bucle esperaba para
            // siempre y el usuario solo veía el timeout genérico de 60s de
            // GoogleAuthManager sin ninguna pista de la causa real.
            var maxAttempts = 50;
            function tryInit() {
                if (window.google && window.google.accounts && window.google.accounts.id) {
                    window.google.accounts.id.initialize({
                        client_id: clientId,
                        callback: __taskhubGisCredentialCallback,
                        auto_select: false
                    });
                    window.google.accounts.id.prompt(__taskhubGisNotificationCallback);
                } else if (attempts >= maxAttempts) {
                    window.__taskhubGis.value = "";
                    window.__taskhubGis.reason = "gis_not_loaded";
                    window.__taskhubGis.state = "done";
                } else {
                    attempts += 1;
                    setTimeout(tryInit, 100);
                }
            }
            tryInit();
        }
    </script>
    <script src="composeApp.js"></script>
</body>
</html>
